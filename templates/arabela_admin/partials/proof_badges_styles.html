<style>
    /* Small chips on a booking: what the receipt check found and what the owner found in her GCash. Own pb-/pvk- names, because the admin CSS build is sparse. */
    .pb-row { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
    .pb-chip { display: inline-flex; align-items: center; padding: .08rem .55rem; border-radius: 999px; font-size: .6875rem; font-weight: 600; line-height: 1.5; white-space: nowrap; }
    .pb-chip--ok { background: #ecfdf3; color: #027a48; }
    .pb-chip--warn { background: #fffaeb; color: #b54708; }
    .pb-chip--bad { background: #fef3f2; color: #b42318; }
    .pb-chip--muted { background: #f2f4f7; color: #475467; }
    .dark .pb-chip--ok { background: rgba(18, 183, 106, .16); color: #32d583; }
    .dark .pb-chip--warn { background: rgba(247, 144, 9, .16); color: #fdb022; }
    .dark .pb-chip--bad { background: rgba(240, 68, 56, .16); color: #f97066; }
    .dark .pb-chip--muted { background: rgba(255, 255, 255, .08); color: #98a2b3; }

    /* The proof window's receipt-check box and the owner's two buttons. */
    .pvk-box { margin-top: 1rem; padding: .9rem 1.1rem; border: 1px solid #e4e7ec; border-radius: .9rem; background: #f9fafb; }
    .dark .pvk-box { border-color: #1d2939; background: rgba(255, 255, 255, .03); }
    .pvk-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .5rem; font-size: .8125rem; font-weight: 600; color: #1d2939; }
    .dark .pvk-head { color: rgba(255, 255, 255, .9); }
    .pvk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem 1rem; margin-bottom: .5rem; }
    .pvk-l { margin: 0; font-size: .6875rem; color: #667085; }
    .pvk-v { margin: .1rem 0 0; font-size: .8125rem; font-weight: 600; color: #101828; word-break: break-word; }
    .dark .pvk-v { color: rgba(255, 255, 255, .92); }
    .pvk-notes { margin: .4rem 0 0; padding-left: 1.1rem; font-size: .75rem; color: #b54708; }
    .dark .pvk-notes { color: #fdb022; }
    .pvk-owner { margin-top: .9rem; padding-top: .8rem; border-top: 1px dashed #d0d5dd; }
    .dark .pvk-owner { border-top-color: #344054; }
    .pvk-owner p { margin: 0 0 .5rem; font-size: .75rem; color: #475467; }
    .dark .pvk-owner p { color: #98a2b3; }
    .pvk-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
    .pvk-btn { border: 0; border-radius: .6rem; padding: .5rem .95rem; font-size: .8125rem; font-weight: 600; color: #fff; cursor: pointer; }
    .pvk-btn--ok { background: #12b76a; }
    .pvk-btn--ok:hover { background: #039855; }
    .pvk-btn--bad { background: #f04438; }
    .pvk-btn--bad:hover { background: #d92d20; }
    .pvk-btn[disabled] { opacity: .55; cursor: not-allowed; }
</style>
