<div id="explore-click-away" class="fixed inset-0 z-[86] bg-black/30 opacity-0 pointer-events-none transition-opacity duration-300" onclick="closeExploreDrawer()" aria-hidden="true"></div>

<aside id="explore-collections-drawer" class="fixed top-0 right-0 h-full w-full max-w-[85vw] md:w-[400px] bg-white z-[87] translate-x-full transform transition-transform duration-500 ease-in-out shadow-none flex flex-col overflow-hidden" aria-hidden="true">
  <header class="shrink-0 p-8 flex justify-end items-center">
    <button type="button" class="hover:opacity-50 transition-opacity text-secondary" onclick="closeExploreDrawer()" aria-label="Close collections">
      <span class="material-symbols-outlined text-2xl">close</span>
    </button>
  </header>
  <div class="flex-1 overflow-y-auto ai-scroll px-8 py-8 min-h-0 flex flex-col">
    <button type="button" class="explore-reveal flex w-full cursor-pointer items-center justify-between text-left group" data-explore-toggle aria-expanded="true" aria-controls="explore-collections-panel">
      <span class="font-label text-[0.75rem] font-semibold uppercase tracking-[0.15em] text-secondary transition-colors group-hover:text-primary">Explore collections</span>
      <span class="text-[0.75rem] text-on-surface-variant shrink-0 transition-transform duration-400 ease-in-out group-hover:text-primary" data-explore-chevron aria-hidden="true">∨</span>
    </button>

    <div id="explore-collections-panel" data-explore-panel class="grid overflow-hidden transition-[grid-template-rows] duration-400 ease-in-out motion-reduce:transition-none" style="grid-template-rows: 1fr">
      <div class="min-h-0 overflow-hidden">
      <div id="explore-collections-nav" class="space-y-6 pt-6" aria-label="Collections">
        {% with u=request.resolver_match.url_name %}
        {% for c in search_overlay_collections_meta %}
        <div class="explore-reveal">
          {% if u == c.url_name %}
          <div class="flex w-full max-w-full items-center {% if c.key != 'all' %}justify-between{% endif %} gap-2 rounded-full bg-gray-50 border border-black/5 px-4 py-2">
            <span class="font-label text-[0.65rem] font-medium uppercase tracking-widest text-primary">{{ c.label }}</span>
            {% if c.key != 'all' %}
            <a href="{% url 'gowns:collection_all' %}" class="inline-flex shrink-0 items-center justify-center text-primary hover:opacity-60 transition-opacity" aria-label="Back to all collections" onclick="if (typeof closeExploreDrawer === 'function') closeExploreDrawer();">
              <span class="material-symbols-outlined text-sm cursor-pointer">close</span>
            </a>
            {% endif %}
          </div>
          {% else %}
          <a href="{{ c.url }}" class="block font-label text-[0.65rem] uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" onclick="if (typeof closeExploreDrawer === 'function') closeExploreDrawer();">{{ c.label }}</a>
          {% endif %}
        </div>
        {% endfor %}
        {% endwith %}
      </div>
      </div>
    </div>

    <div class="mt-8 pt-8">
      <button type="button" class="explore-reveal flex w-full cursor-pointer items-center justify-between text-left group" data-sort-toggle aria-expanded="false" aria-controls="collection-sort-options">
        <span class="font-label text-[0.75rem] font-semibold uppercase tracking-[0.15em] text-secondary transition-colors group-hover:text-primary">Sort by</span>
        <span class="text-[0.75rem] text-on-surface-variant shrink-0 transition-transform duration-400 ease-in-out group-hover:text-primary" data-sort-chevron aria-hidden="true">∨</span>
      </button>

      <div id="collection-sort-options" data-sort-panel class="grid overflow-hidden transition-[grid-template-rows] duration-400 ease-in-out motion-reduce:transition-none" style="grid-template-rows: 0fr">
        <div class="min-h-0 overflow-hidden">
        <div class="space-y-6 pt-6" role="group" aria-label="Sort options">
          <div class="explore-reveal" data-sort-row data-sort-mode="az">
            <button type="button" class="w-full text-left font-label text-[0.65rem] uppercase tracking-widest text-on-surface-variant transition-colors hover:text-primary py-2 px-1 rounded-md" data-sort-option data-sort-mode="az" data-sort-label="ALPHABETICALLY, A-Z">Alphabetically, A-Z</button>
            <div class="hidden flex w-full max-w-full items-center justify-between gap-2 rounded-full bg-gray-50 border border-black/5 px-4 py-2" data-sort-selected-shell>
              <span class="font-label text-[0.65rem] font-medium uppercase tracking-widest text-primary truncate pr-2" data-sort-pill-label></span>
              <button type="button" class="inline-flex shrink-0 items-center justify-center text-primary hover:opacity-60 transition-opacity" data-sort-pill-dismiss aria-label="Clear sort selection">
                <span class="material-symbols-outlined text-sm cursor-pointer leading-none">close</span>
              </button>
            </div>
          </div>
          <div class="explore-reveal" data-sort-row data-sort-mode="za">
            <button type="button" class="w-full text-left font-label text-[0.65rem] uppercase tracking-widest text-on-surface-variant transition-colors hover:text-primary py-2 px-1 rounded-md" data-sort-option data-sort-mode="za" data-sort-label="ALPHABETICALLY, Z-A">Alphabetically, Z-A</button>
            <div class="hidden flex w-full max-w-full items-center justify-between gap-2 rounded-full bg-gray-50 border border-black/5 px-4 py-2" data-sort-selected-shell>
              <span class="font-label text-[0.65rem] font-medium uppercase tracking-widest text-primary truncate pr-2" data-sort-pill-label></span>
              <button type="button" class="inline-flex shrink-0 items-center justify-center text-primary hover:opacity-60 transition-opacity" data-sort-pill-dismiss aria-label="Clear sort selection">
                <span class="material-symbols-outlined text-sm cursor-pointer leading-none">close</span>
              </button>
            </div>
          </div>
          <div class="explore-reveal" data-sort-row data-sort-mode="priceAsc">
            <button type="button" class="w-full text-left font-label text-[0.65rem] uppercase tracking-widest text-on-surface-variant transition-colors hover:text-primary py-2 px-1 rounded-md" data-sort-option data-sort-mode="priceAsc" data-sort-label="PRICE, LOW TO HIGH">Price, low to high</button>
            <div class="hidden flex w-full max-w-full items-center justify-between gap-2 rounded-full bg-gray-50 border border-black/5 px-4 py-2" data-sort-selected-shell>
              <span class="font-label text-[0.65rem] font-medium uppercase tracking-widest text-primary truncate pr-2" data-sort-pill-label></span>
              <button type="button" class="inline-flex shrink-0 items-center justify-center text-primary hover:opacity-60 transition-opacity" data-sort-pill-dismiss aria-label="Clear sort selection">
                <span class="material-symbols-outlined text-sm cursor-pointer leading-none">close</span>
              </button>
            </div>
          </div>
          <div class="explore-reveal" data-sort-row data-sort-mode="priceDesc">
            <button type="button" class="w-full text-left font-label text-[0.65rem] uppercase tracking-widest text-on-surface-variant transition-colors hover:text-primary py-2 px-1 rounded-md" data-sort-option data-sort-mode="priceDesc" data-sort-label="PRICE, HIGH TO LOW">Price, high to low</button>
            <div class="hidden flex w-full max-w-full items-center justify-between gap-2 rounded-full bg-gray-50 border border-black/5 px-4 py-2" data-sort-selected-shell>
              <span class="font-label text-[0.65rem] font-medium uppercase tracking-widest text-primary truncate pr-2" data-sort-pill-label></span>
              <button type="button" class="inline-flex shrink-0 items-center justify-center text-primary hover:opacity-60 transition-opacity" data-sort-pill-dismiss aria-label="Clear sort selection">
                <span class="material-symbols-outlined text-sm cursor-pointer leading-none">close</span>
              </button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <div class="flex shrink-0 gap-4 bg-white p-8">
    <button type="button" class="flex-1 bg-primary-container py-4 font-label text-[0.7rem] font-bold uppercase tracking-widest text-on-primary transition-colors hover:opacity-90 rounded-[6px]" data-sort-apply-footer>Apply</button>
    <button type="button" class="flex-1 border border-gray-300 bg-transparent py-4 font-label text-[0.7rem] font-bold uppercase tracking-widest text-primary transition-colors hover:bg-gray-50 rounded-[6px]" data-sort-drawer-reset>Reset</button>
  </div>
</aside>

<script>
(function () {
  var root = document.getElementById('explore-collections-drawer');
  if (!root) return;
  var toggleBtn = root.querySelector('[data-explore-toggle]');
  var panel = root.querySelector('[data-explore-panel]');
  var chevron = root.querySelector('[data-explore-chevron]');
  var sortToggle = root.querySelector('[data-sort-toggle]');
  var sortPanel = root.querySelector('[data-sort-panel]');
  var sortChevron = root.querySelector('[data-sort-chevron]');
  if (!toggleBtn || !panel) return;

  var drawerAccordionMode = 'explore';

  function setExpanded(isExpanded) {
    toggleBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
    panel.style.gridTemplateRows = isExpanded ? '1fr' : '0fr';
    if (chevron) {
      chevron.style.transform = isExpanded ? 'rotate(180deg)' : '';
    }
  }

  function setSortExpanded(isExpanded) {
    if (!sortToggle || !sortPanel) return;
    sortToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
    sortPanel.style.gridTemplateRows = isExpanded ? '1fr' : '0fr';
    if (sortChevron) {
      sortChevron.style.transform = isExpanded ? 'rotate(180deg)' : '';
    }
  }

  window.setCollectionsDrawerAccordion = function (mode) {
    drawerAccordionMode = mode === 'sort' ? 'sort' : 'explore';
    if (drawerAccordionMode === 'explore') {
      setExpanded(true);
    } else {
      setSortExpanded(true);
    }
  };

  window.getCollectionsDrawerMode = function () {
    return drawerAccordionMode;
  };

  toggleBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var isOpen = toggleBtn.getAttribute('aria-expanded') === 'true';
    setExpanded(!isOpen);
    drawerAccordionMode = 'explore';
  });

  if (sortToggle && sortPanel) {
    sortToggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var isOpen = sortToggle.getAttribute('aria-expanded') === 'true';
      setSortExpanded(!isOpen);
      drawerAccordionMode = 'sort';
    });
  }

  window.collapseExploreCollectionsPanel = function () {
    setExpanded(false);
  };

  window.collapseSortCollectionsPanel = function () {
    setSortExpanded(false);
  };

  setExpanded(true);
  setSortExpanded(false);
})();
</script>
