{% if page_obj.paginator.num_pages > 1 %}
<div class="mt-16 flex justify-center">
    <div class="flex flex-col items-center gap-12">
        <div class="flex items-center gap-10">
            {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}" class="group flex items-center gap-4 hover:opacity-50 transition-all duration-500">
                <span class="material-symbols-outlined text-[1rem] font-extralight transition-transform duration-500 group-hover:-translate-x-2">arrow_back</span>
                <span class="font-body text-[0.65rem] uppercase tracking-[0.4em] font-light text-secondary">Previous</span>
            </a>
            {% endif %}
            <span class="font-label text-[0.6rem] uppercase tracking-[0.3em] text-secondary/40">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
            {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}" class="group flex items-center gap-4 hover:opacity-50 transition-all duration-500">
                <span class="font-body text-[0.65rem] uppercase tracking-[0.4em] font-light text-secondary">Next</span>
                <span class="material-symbols-outlined text-[1rem] font-extralight transition-transform duration-500 group-hover:translate-x-2">arrow_forward</span>
            </a>
            {% endif %}
        </div>
        <div class="h-[1px] w-24 bg-on-surface/10"></div>
        <button class="font-label text-[0.6rem] uppercase tracking-[0.3em] text-secondary/40 hover:text-secondary transition-all duration-300 bg-transparent border-0 p-0 cursor-pointer">
            Explore More {{ label }} Pieces
        </button>
    </div>
</div>
{% endif %}
